<script>
const originalBank = [{"topic": "Stroke", "stem": "Pria 60 tahun mengalami kelemahan lengan dan tungkai kanan serta gangguan bicara yang pulih total dalam 2 jam. CT kepala normal. Diagnosis paling mungkin adalah:", "options": ["Stroke iskemik akut", "Stroke hemoragik", "TIA sirkulasi karotis", "TIA vertebrobasilar", "Epilepsi parsial kompleks"], "answer": 2, "rationale": "Defisit fokal hemisfer anterior yang pulih sempurna dalam waktu singkat sesuai TIA sirkulasi karotis.", "image": null}, {"topic": "Stroke", "stem": "Wanita 55 tahun mengalami vertigo berat, diplopia, dan disfagia yang hilang dalam 8 jam tanpa kelumpuhan. Jenis TIA paling sesuai adalah:", "options": ["TIA karotis", "TIA vertebrobasilar", "Stroke lakunar", "Stroke in evolution", "Hipotensi postural"], "answer": 1, "rationale": "Vertigo, diplopia, dan disfagia adalah gejala sirkulasi posterior/vertebrobasilar.", "image": null}, {"topic": "Stroke", "stem": "Pasien hipertensi mendadak mengalami nyeri kepala hebat, muntah, dan penurunan kesadaran. CT menunjukkan perdarahan kapsula interna. Penyebab tersering adalah:", "options": ["Aneurisma berry", "AVM", "Aterosklerosis karotis", "Perdarahan intraserebral hipertensif", "Infark trombotik"], "answer": 3, "rationale": "Hipertensi kronis dapat menyebabkan lipohialinosis dan mikroaneurisma Charcot-Bouchard pada arteri penetran.", "image": null}, {"topic": "Stroke", "stem": "Laki-laki 70 tahun mengalami hemiparesis saat tidur dan defisit berkembang perlahan selama 3 jam. Diagnosis yang paling mungkin adalah:", "options": ["Emboli serebri", "Trombosis serebri", "Perdarahan intraserebral hipertensif", "Perdarahan subaraknoid", "Stroke lakunar"], "answer": 1, "rationale": "Trombosis serebri umumnya berkembang bertahap dan sering terjadi saat istirahat atau tidur.", "image": null}, {"topic": "Stroke", "stem": "Pasien dengan fibrilasi atrium mendadak mengalami hemiparesis kanan dan afasia ketika sedang berbicara. Diagnosis paling mungkin adalah:", "options": ["Trombosis serebri", "Emboli serebri", "Stroke lakunar", "Perdarahan subaraknoid", "Hipoglikemia"], "answer": 1, "rationale": "Onset sangat mendadak dengan fibrilasi atrium menunjang emboli kardioembolik.", "image": null}, {"topic": "Stroke", "stem": "Pada stroke iskemik akut yang tidak akan mendapat trombolisis, tekanan darah umumnya baru diturunkan bila:", "options": ["TDS >160 atau TDD >100 mmHg", "TDS >180 atau TDD >105 mmHg", "TDS >220 atau TDD >120 mmHg", "Selalu diturunkan segera", "Setelah 3 hari pada semua pasien"], "answer": 2, "rationale": "Permissive hypertension dipertahankan kecuali tekanan darah sangat tinggi, sekitar >220/120 mmHg.", "image": null}, {"topic": "Stroke", "stem": "Mengapa hiperglikemia pada stroke iskemik akut perlu dikontrol?", "options": ["Mencegah hiponatremia", "Mencegah edema perifer", "Memperluas infark melalui asidosis laktat", "Mencegah infeksi nosokomial", "Meningkatkan aliran kolateral"], "answer": 2, "rationale": "Hiperglikemia memperburuk cedera iskemik melalui metabolisme anaerob dan asidosis laktat.", "image": null}, {"topic": "Stroke", "stem": "Pasien datang 2 jam setelah onset stroke iskemik, CT tidak menunjukkan perdarahan, dan tidak ada kontraindikasi. Terapi reperfusi yang tepat adalah:", "options": ["Aspirin dosis muatan", "Alteplase intravena", "Warfarin", "Nimodipine", "Mannitol"], "answer": 1, "rationale": "Trombolisis IV dipertimbangkan pada pasien terpilih dalam jendela waktu yang sesuai setelah CT menyingkirkan perdarahan.", "image": null}, {"topic": "Stroke", "stem": "Pasien dengan nyeri kepala oksipital sangat hebat, muntah, dan kaku kuduk memiliki darah di ruang subaraknoid pada CT. Penyebab tersering adalah:", "options": ["Trauma kepala", "Ruptur aneurisma berry", "Infark lakunar", "Hipertensi esensial", "Tumor otak"], "answer": 1, "rationale": "Penyebab spontan tersering perdarahan subaraknoid adalah ruptur aneurisma sakular/berry.", "image": null}, {"topic": "Stroke", "stem": "Tujuan utama nimodipine oral pada perdarahan subaraknoid akibat aneurisma adalah:", "options": ["Mengontrol tekanan darah", "Mencegah vasospasme serebral", "Mengurangi edema serebri", "Menghambat rebleeding", "Mengurangi nyeri kepala"], "answer": 1, "rationale": "Nimodipine menurunkan risiko defisit iskemik tertunda akibat vasospasme.", "image": null}, {"topic": "Stroke", "stem": "Pasien mengalami hemiparesis kanan, paresis wajah sentral kanan, serta afasia reseptif dan ekspresif. Topis paling mungkin adalah:", "options": ["Arteri serebri media kiri", "Arteri serebri media kanan", "Arteri serebri posterior kiri", "Arteri basilaris", "Arteri serebri anterior kanan"], "answer": 0, "rationale": "Afasia dan defisit motorik sisi kanan menunjuk hemisfer dominan kiri, lazimnya wilayah ACM kiri.", "image": null}, {"topic": "Neurologi", "stem": "Wajah merot ke kiri, kerutan dahi kanan menghilang, dan penutupan mata kanan lemah tanpa defisit ekstremitas. Lesi paling mungkin adalah:", "options": ["N. facialis perifer kanan", "N. facialis perifer kiri", "N. facialis sentral kanan", "N. facialis sentral kiri", "N. hipoglosus sentral kanan"], "answer": 0, "rationale": "Kelemahan seluruh hemifasial termasuk dahi dan mata menunjukkan palsi fasialis perifer sisi kanan.", "image": null}, {"topic": "Neurologi", "stem": "Ptosis, diplopia, mata 'down and out', dan pupil melebar tidak reaktif pada mata kiri menunjukkan lesi:", "options": ["N. II", "N. III", "N. IV", "N. V", "N. VI"], "answer": 1, "rationale": "N. okulomotorius mempersarafi sebagian besar otot ekstraokular, levator palpebra, dan parasimpatis pupil.", "image": null}, {"topic": "Neurologi", "stem": "Pada palsi N. III, otot berikut tidak dipersarafi oleh nervus tersebut adalah:", "options": ["M. rectus medialis", "M. rectus inferior", "M. obliquus inferior", "M. levator palpebrae", "M. orbicularis oculi"], "answer": 4, "rationale": "Orbicularis oculi dipersarafi N. VII, bukan N. III.", "image": null}, {"topic": "Neurologi", "stem": "Baal jari manis dan kelingking dengan adduksi jari melemah pada pesepeda jarak jauh paling menunjang lesi:", "options": ["N. ulnaris di Guyon canal", "N. medianus di carpal tunnel", "N. radialis superfisial", "N. musculocutaneus", "Trunkus superior pleksus brakialis"], "answer": 0, "rationale": "Kompresi setang sepeda dapat mengenai N. ulnaris di kanal Guyon.", "image": null}, {"topic": "Neurologi", "stem": "Kelemahan progresif simetris naik setelah infeksi saluran napas/diare, arefleksia, dan parestesia paling sesuai dengan:", "options": ["Myelitis transversa", "Poliomielitis", "Myasthenia gravis", "Sindrom Guillain-Barre", "Multiple sclerosis"], "answer": 3, "rationale": "GBS lazimnya berupa poliradikuloneuropati akut pascainfeksi dengan kelemahan asendens dan arefleksia.", "image": null}, {"topic": "Neurologi", "stem": "Temuan cairan serebrospinal yang khas pada sindrom Guillain-Barre adalah:", "options": ["Pleositosis neutrofil", "Disosiasi sitoalbumin", "Hipoglikorakia berat", "Basil tahan asam positif", "Xantokromia"], "answer": 1, "rationale": "Disosiasi albuminositologis berarti protein meningkat dengan jumlah sel normal atau hanya sedikit meningkat.", "image": null}, {"topic": "Neurologi", "stem": "Edrophonium pada pemeriksaan myasthenia gravis bekerja dengan cara:", "options": ["Menghambat asetilkolinesterase", "Meningkatkan reuptake asetilkolin", "Meningkatkan pelepasan GABA", "Meningkatkan dopamin substansia nigra", "Menghambat reuptake serotonin"], "answer": 0, "rationale": "Edrophonium sementara meningkatkan asetilkolin di celah neuromuskular melalui inhibisi asetilkolinesterase.", "image": null}, {"topic": "Neurologi", "stem": "Kesemutan ibu jari, telunjuk, jari tengah, dan sisi radial jari manis, disertai atrofi thenar serta Phalen positif, menunjukkan:", "options": ["Sindrom terowongan karpal", "Sindrom kanal Guyon", "Radikulopati C8", "Lesi N. radialis", "Tennis elbow"], "answer": 0, "rationale": "Distribusi medianus dan tanda provokatif menunjang carpal tunnel syndrome.", "image": null}, {"topic": "Neurologi", "stem": "Pada carpal tunnel syndrome, tanda yang mengarah pada indikasi dekompresi operasi adalah:", "options": ["Flick sign positif saja", "Tinel positif saja", "Phalen positif saja", "Atrofi otot thenar", "Nyeri setelah aktivitas saja"], "answer": 3, "rationale": "Atrofi thenar menunjukkan denervasi/kompresi berat dan menjadi indikasi evaluasi bedah.", "image": null}, {"topic": "Neurologi", "stem": "Pengguna kruk mengalami wrist drop dan gangguan sensibilitas punggung tangan. Saraf yang paling mungkin terkena adalah:", "options": ["N. ulnaris", "N. radialis", "N. medianus", "N. axillaris", "N. peroneus"], "answer": 1, "rationale": "Kompresi 'crutch palsy' mengenai N. radialis, menyebabkan wrist drop.", "image": null}, {"topic": "Neurologi", "stem": "Pasien membuka mata terhadap nyeri, melokalisasi nyeri, dan mengeluarkan kata-kata tidak sesuai. Skor GCS adalah:", "options": ["E2 M4 V2 = 8", "E2 M5 V3 = 10", "E3 M5 V2 = 10", "E2 M6 V3 = 11", "E4 M5 V4 = 13"], "answer": 1, "rationale": "Respons mata terhadap nyeri 2, motorik melokalisasi 5, dan verbal kata-kata tidak sesuai 3.", "image": null}, {"topic": "Neurologi", "stem": "Hilangnya lapang pandang temporal pada kedua mata disebut:", "options": ["Hemianopia homonim", "Hemianopia bitemporal", "Hemianopia binasal", "Skotoma sentral", "Quadrantanopia"], "answer": 1, "rationale": "Hilangnya lapang pandang temporal kedua mata adalah hemianopia bitemporal.", "image": null}, {"topic": "Neurologi", "stem": "Lesi yang paling sering menyebabkan hemianopia bitemporal adalah pada:", "options": ["N. optikus", "Kiasma optikum", "Traktus optikus", "Radiatio optika", "Korteks oksipital"], "answer": 1, "rationale": "Serabut nasal yang menyilang di kiasma membawa lapang pandang temporal.", "image": null}, {"topic": "Neurologi", "stem": "Tremor istirahat, bradikinesia, rigiditas cogwheel, dan postur membungkuk pada penyakit Parkinson terutama berhubungan dengan kekurangan:", "options": ["Asetilkolin", "Dopamin", "GABA", "Glutamat", "Serotonin"], "answer": 1, "rationale": "Degenerasi neuron dopaminergik substantia nigra menyebabkan defisit dopamin striatal.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien dengan epilepsi terkontrol mengalami halusinasi dengar dan kecurigaan yang muncul setelah periode kejang. Psikosis yang paling lazim terkait epilepsi adalah:", "options": ["Psikosis pascaiktal", "Hiperreligiositas", "Viskositas", "Skizofrenia-like psikosis", "Forced normalization"], "answer": 0, "rationale": "Psikosis pascaiktal merupakan bentuk psikosis yang umum pada pasien epilepsi.", "image": null}, {"topic": "Psikiatri", "stem": "Pengguna zat menyadari masalah akibat NAPZA dan mulai mempertimbangkan perubahan, tetapi belum berkomitmen. Tahap perubahan adalah:", "options": ["Prekontemplasi", "Kontemplasi", "Persiapan", "Aksi", "Pemeliharaan"], "answer": 1, "rationale": "Pada kontemplasi, pasien menyadari masalah dan mempertimbangkan perubahan namun belum berkomitmen.", "image": null}, {"topic": "Psikiatri", "stem": "Perempuan mencabut rambut berulang saat sendiri hingga tampak botak dan merasa malu. Diagnosisnya adalah:", "options": ["Pyromania", "Kleptomania", "Trikotilomania", "Gangguan eksplosif intermiten", "Judi patologis"], "answer": 2, "rationale": "Trikotilomania ditandai dorongan berulang mencabut rambut hingga terjadi kerontokan.", "image": null}, {"topic": "Psikiatri", "stem": "Hipotensi ortostatik akibat chlorpromazine terutama terjadi karena blokade reseptor:", "options": ["Alfa-adrenergik", "Muskarinik", "Histamin H1", "Dopamin D2", "5-HT2A"], "answer": 0, "rationale": "Antagonisme alfa-1 adrenergik menyebabkan vasodilatasi dan hipotensi ortostatik.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien gelisah, tidur berkurang, belanja berlebihan, dan memiliki banyak ide tanpa gejala depresi. Diagnosis paling sesuai adalah:", "options": ["Episode manik", "Episode depresif", "Gangguan panik", "Gangguan siklotimik", "Skizofrenia"], "answer": 0, "rationale": "Peningkatan energi, kebutuhan tidur berkurang, dan perilaku berisiko menunjang episode manik.", "image": null}, {"topic": "Psikiatri", "stem": "Glutamat merupakan neurotransmiter utama yang bersifat:", "options": ["Eksitatorik", "Inhibitorik", "Neurohormon", "Kolenergik", "Adrenergik"], "answer": 0, "rationale": "Glutamat adalah neurotransmiter eksitatorik utama sistem saraf pusat.", "image": null}, {"topic": "Psikiatri", "stem": "Serangan berulang yang mendadak berupa palpitasi, keringat dingin, cemas hebat, dan takut mati dengan pemeriksaan jantung normal paling sesuai dengan:", "options": ["Gangguan cemas menyeluruh", "Gangguan panik", "Gangguan depresi", "Fobia spesifik", "Gangguan somatoform"], "answer": 1, "rationale": "Serangan panik muncul tiba-tiba, berulang, dan mencapai puncak dengan gejala otonom.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien tetap cemas dan sulit tidur selama 3 hari setelah mengalami gempa. Diagnosis paling tepat adalah:", "options": ["Gangguan cemas menyeluruh", "Gangguan panik", "Gangguan stres akut", "Gangguan stres pascatrauma", "Fobia sosial"], "answer": 2, "rationale": "Gejala setelah trauma yang berlangsung 3 hari hingga kurang dari 1 bulan sesuai gangguan stres akut.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien 60 tahun mengalami lupa progresif, sering tersesat di rumah, dan kehilangan fungsi sehari-hari selama 6 bulan. Diagnosis yang paling sesuai adalah:", "options": ["Delirium", "Demensia vaskular", "Demensia Alzheimer", "Chorea Huntington", "Penyakit Parkinson"], "answer": 2, "rationale": "Gangguan memori progresif dan fungsi eksekutif pada usia lanjut lazim mengarah ke Alzheimer.", "image": null}, {"topic": "Psikiatri", "stem": "Struktur limbik yang berperan besar dalam pemrosesan emosi, terutama takut dan respons emosional, adalah:", "options": ["Hipotalamus", "Talamus", "Hipokampus", "Amigdala", "Korteks prefrontal"], "answer": 3, "rationale": "Amigdala penting pada pemaknaan emosional, khususnya rasa takut.", "image": null}, {"topic": "Psikiatri", "stem": "Menurut teori perkembangan Freud, konflik Oedipus dan ketertarikan pada orang tua lawan jenis terjadi pada fase:", "options": ["Oral", "Anal", "Falik", "Laten", "Genital"], "answer": 2, "rationale": "Kompleks Oedipus/Electra dikaitkan dengan tahap falik.", "image": null}, {"topic": "Psikiatri", "stem": "Kebingungan akut, bicara meracau, gelisah, dan tidak mengenali keluarga yang terjadi mendadak setelah demam paling sesuai dengan:", "options": ["Demensia Alzheimer", "Demensia vaskular", "Delirium", "Depresi", "Gangguan amnestik"], "answer": 2, "rationale": "Onset akut dan fluktuatif dengan gangguan atensi mengarah ke delirium.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien takut naik pesawat dan takut ketinggian secara menetap. Gangguan yang paling sesuai adalah:", "options": ["Agorafobia", "Fobia spesifik", "Fobia sosial", "Gangguan panik", "GAD"], "answer": 1, "rationale": "Ketakutan terhadap objek/situasi tertentu seperti terbang dan ketinggian adalah fobia spesifik.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien memperoleh kepuasan seksual dengan mengintip orang telanjang melalui jendela. Diagnosisnya adalah:", "options": ["Fetisisme", "Voyeurisme", "Ekshibisionisme", "Pedofilia", "Transvestisme"], "answer": 1, "rationale": "Voyeurisme adalah rangsangan seksual dari mengamati orang tanpa sepengetahuan orang tersebut.", "image": null}, {"topic": "Psikiatri", "stem": "Orang dewasa memiliki ketertarikan seksual utama pada anak prapubertas. Gangguan preferensi seksual yang sesuai adalah:", "options": ["Fetisisme", "Voyeurisme", "Pedofilia", "Froteurisme", "Ekshibisionisme"], "answer": 2, "rationale": "Pedofilia ditandai ketertarikan seksual pada anak prapubertas.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien mengeluh nyeri kepala, nyeri ulu hati, dan insomnia setelah pindah kerja; pemeriksaan fisik dan laboratorium normal. Diagnosis paling tepat adalah:", "options": ["Gangguan penyesuaian", "Skizofrenia", "Gangguan panik", "Gangguan obsesif kompulsif", "Demensia"], "answer": 0, "rationale": "Gejala emosional/somatik yang muncul setelah stresor yang jelas dan menyebabkan gangguan fungsi menunjang gangguan penyesuaian.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien terus meyakini dirinya menderita penyakit berat meskipun pemeriksaan berulang normal. Gangguan yang paling sesuai adalah:", "options": ["Gangguan konversi", "Gangguan kecemasan penyakit/hipokondriasis", "Gangguan disosiatif", "Gangguan panik", "Delirium"], "answer": 1, "rationale": "Preokupasi menetap bahwa memiliki penyakit serius, walau evaluasi medis tidak mendukung, sesuai kecemasan penyakit.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien mengalami kebutaan fungsional setelah stres berat; evaluasi neurologis normal. Diagnosis paling tepat adalah:", "options": ["Gangguan somatisasi", "Gangguan konversi", "Gangguan panik", "Gangguan cemas menyeluruh", "Gangguan stres akut"], "answer": 1, "rationale": "Gejala neurologis yang tidak sesuai penyakit neurologis dan terkait stresor menandakan gangguan konversi.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien merasa ada serangga merayap di kulit padahal tidak ada rangsang nyata. Ini adalah:", "options": ["Halusinasi auditorik", "Halusinasi visual", "Halusinasi taktil", "Ilusi", "Waham somatik"], "answer": 2, "rationale": "Persepsi sentuhan tanpa stimulus eksternal merupakan halusinasi taktil.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien yakin pikirannya disiarkan sehingga orang lain dapat mendengarnya. Gejala ini disebut:", "options": ["Thought withdrawal", "Thought insertion", "Thought control", "Thought broadcasting", "Pseudologia fantastica"], "answer": 3, "rationale": "Thought broadcasting adalah keyakinan bahwa isi pikiran diketahui atau disiarkan kepada orang lain.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien melihat orang yang tidak ada di ruangan saat sadar penuh. Gangguan persepsi ini disebut:", "options": ["Waham", "Halusinasi visual", "Ilusi", "Derealisation", "Depersonalisasi"], "answer": 1, "rationale": "Halusinasi adalah persepsi tanpa rangsang eksternal; jika berupa penglihatan, disebut halusinasi visual.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien sering bicara sendiri, memiliki halusinasi dengar, dan curiga akan disakiti selama >6 bulan. Diagnosis yang paling sesuai adalah:", "options": ["Skizofrenia paranoid", "Skizofrenia katatonik", "Skizofrenia simpleks", "Gangguan bipolar", "Gangguan waham menetap"], "answer": 0, "rationale": "Gejala positif dominan berupa waham paranoid dan halusinasi selama sedikitnya 6 bulan menunjang skizofrenia paranoid.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien dengan skizofrenia tampak mempertahankan posisi tubuh yang dipaksakan dalam waktu lama dan menolak diubah. Gejala catatonia tersebut adalah:", "options": ["Ekolalia", "Ekopraksia", "Fleksibilitas serea", "Flight of ideas", "Neologisme"], "answer": 2, "rationale": "Fleksibilitas serea adalah mempertahankan posisi yang dikenakan pemeriksa seperti lilin.", "image": null}, {"topic": "Psikiatri", "stem": "Gejala naik-turun mood ringan yang bergantian selama ≥2 tahun tanpa memenuhi episode manik/depresif mayor disebut:", "options": ["Distimia", "Siklotimia", "Bipolar I", "Bipolar II", "Gangguan penyesuaian"], "answer": 1, "rationale": "Siklotimia berupa gejala hipomanik dan depresif ringan kronik yang tidak memenuhi kriteria episode penuh.", "image": null}, {"topic": "Psikiatri", "stem": "Remaja berulang kali mencuri barang yang tidak dibutuhkan dan merasa dorongan kuat sebelum mencuri. Diagnosisnya adalah:", "options": ["Pyromania", "Trikotilomania", "Kleptomania", "Gangguan kepribadian antisosial", "Judi patologis"], "answer": 2, "rationale": "Kleptomania adalah kegagalan berulang menahan dorongan mencuri benda yang tidak diperlukan.", "image": null}, {"topic": "Psikiatri", "stem": "Seorang pasien tidak dapat mengingat peristiwa traumatis setelah kecelakaan tanpa bukti cedera otak. Gangguan ini paling sesuai dengan:", "options": ["Amnesia disosiatif", "Demensia", "Delirium", "Gangguan identitas disosiatif", "Retrogade amnesia organik"], "answer": 0, "rationale": "Amnesia disosiatif melibatkan ketidakmampuan mengingat informasi autobiografis penting, umumnya traumatis.", "image": null}, {"topic": "Psikiatri", "stem": "Pria pergi meninggalkan rumah tanpa tujuan dan tidak mengingat identitas dirinya setelah konflik berat. Diagnosisnya adalah:", "options": ["Amnesia disosiatif", "Fugue disosiatif", "Depersonalisasi", "Derealisation", "Somnambulisme"], "answer": 1, "rationale": "Fugue disosiatif meliputi perjalanan tak terduga dengan amnesia identitas/autobiografis.", "image": null}, {"topic": "Psikiatri", "stem": "Area otak reseptif utama untuk pemahaman bahasa lisan adalah:", "options": ["Area Broca", "Area Wernicke", "Girus precentral", "Hipokampus", "Amigdala"], "answer": 1, "rationale": "Area Wernicke pada hemisfer dominan terutama berperan dalam pemahaman bahasa.", "image": null}, {"topic": "Psikiatri", "stem": "Pembelajaran keterampilan mengendarai sepeda terutama menggunakan jenis memori:", "options": ["Memori episodik", "Memori semantik", "Memori prosedural/implisit", "Memori kerja", "Memori sensorik"], "answer": 2, "rationale": "Keterampilan motorik otomatis disimpan sebagai memori prosedural implisit.", "image": null}, {"topic": "Psikiatri", "stem": "Seorang pasien merasa dirinya asing dan seperti bukan dirinya yang dulu. Gejala ini disebut:", "options": ["Derealisation", "Waham", "Ilusi", "Depersonalisasi", "Thought insertion"], "answer": 3, "rationale": "Depersonalisasi adalah pengalaman terlepas atau asing dari diri sendiri.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien yakin tanpa bukti bahwa pasangannya selingkuh dan tidak berubah walaupun diberi bukti sebaliknya. Ini adalah:", "options": ["Waham kejar", "Waham curiga/cemburu", "Waham kebesaran", "Waham somatik", "Waham nihilistik"], "answer": 1, "rationale": "Keyakinan menetap bahwa pasangan tidak setia termasuk waham cemburu/curiga.", "image": null}, {"topic": "Psikiatri", "stem": "Kepribadian yang curiga berlebihan, merasa ditipu, hipersensitif terhadap kritik, dan menyimpan dendam adalah:", "options": ["Skizoid", "Anankastik", "Histrionik", "Paranoid", "Dependen"], "answer": 3, "rationale": "Ciri inti gangguan kepribadian paranoid adalah ketidakpercayaan dan kecurigaan yang menetap.", "image": null}, {"topic": "Psikiatri", "stem": "Kepribadian yang tidak peduli pujian/kritik, memilih aktivitas sendiri, dan hanya sedikit teman dekat adalah:", "options": ["Paranoid", "Skizotipal", "Skizoid", "Histrionik", "Antisosial"], "answer": 2, "rationale": "Gangguan kepribadian skizoid ditandai keterlepasan dari hubungan sosial dan afek terbatas.", "image": null}, {"topic": "Psikiatri", "stem": "Kepribadian yang mencari perhatian, dramatis, bereaksi berlebihan, dan mudah dipengaruhi adalah:", "options": ["Anankastik", "Dependen", "Narsistik", "Histrionik", "Paranoid"], "answer": 3, "rationale": "Ciri dominan kepribadian histrionik adalah emosionalitas berlebihan dan mencari perhatian.", "image": null}, {"topic": "Psikiatri", "stem": "Perfectionisme yang menghambat penyelesaian tugas, sangat ragu, dan sulit mendelegasikan pekerjaan adalah ciri kepribadian:", "options": ["Narsistik", "Histrionik", "Anankastik", "Pasif-agresif", "Antisosial"], "answer": 2, "rationale": "Gangguan kepribadian anankastik (OCPD) ditandai preokupasi terhadap ketertiban dan perfeksionisme.", "image": null}, {"topic": "Farmakologi", "stem": "Toksisitas lithium berat ditangani dengan:", "options": ["Menambah dosis lithium", "Penghentian lithium dan hemodialisis", "Pemberian nalokson", "Pemberian flumazenil", "Pemberian antikolinergik"], "answer": 1, "rationale": "Toksisitas lithium berat memerlukan penghentian obat dan eliminasi cepat dengan hemodialisis.", "image": null}, {"topic": "Farmakologi", "stem": "Krisis hipertensi setelah konsumsi makanan kaya tiramin paling terkait dengan penggunaan:", "options": ["SSRI", "MAOI", "Antipsikotik atipikal", "Benzodiazepin", "Mood stabilizer"], "answer": 1, "rationale": "MAOI mencegah metabolisme tiramin sehingga dapat mencetuskan krisis hipertensi.", "image": null}, {"topic": "Farmakologi", "stem": "Efek samping serius yang memerlukan pemantauan hitung darah berkala pada clozapine adalah:", "options": ["Agranulositosis", "Pankreatitis", "Nefrolitiasis", "Trombositopenia imun", "Hipertiroidisme"], "answer": 0, "rationale": "Clozapine dapat menyebabkan neutropenia berat/agranulositosis.", "image": null}, {"topic": "Farmakologi", "stem": "Aripiprazole memiliki mekanisme khas sebagai:", "options": ["Antagonis penuh D2", "Agonis parsial D2", "Agonis penuh 5-HT2A", "Inhibitor MAO", "Antagonis opioid"], "answer": 1, "rationale": "Aripiprazole adalah agonis parsial D2 dan 5-HT1A serta antagonis 5-HT2A.", "image": null}, {"topic": "Farmakologi", "stem": "Antidepresan trisiklik yang dapat menyebabkan pemanjangan QT dan aritmia fatal pada overdosis adalah:", "options": ["Fluoxetine", "Amitriptyline", "Bupropion", "Sertraline", "Mirtazapine"], "answer": 1, "rationale": "Amitriptyline dan TCA lain dapat menyebabkan aritmia yang berbahaya pada toksisitas.", "image": null}, {"topic": "Farmakologi", "stem": "Antidot utama untuk overdosis opioid adalah:", "options": ["Fentanyl", "Hydromorphone", "Methadone", "Naloxone", "Diazepam"], "answer": 3, "rationale": "Nalokson adalah antagonis reseptor opioid yang membalikkan depresi napas akibat opioid.", "image": null}, {"topic": "Farmakologi", "stem": "Beberapa jam setelah mendapat haloperidol, pasien mengalami spasme leher dan deviasi bola mata. Efek samping ini adalah:", "options": ["Akathisia", "Distonia akut", "Parkinsonisme", "Sindrom neuroleptik malignan", "Tardive dyskinesia"], "answer": 1, "rationale": "Distonia akut adalah EPS dini berupa spasme otot, termasuk tortikolis dan krisis okulogirik.", "image": null}, {"topic": "Farmakologi", "stem": "Antidepresan yang relatif tidak menyebabkan disfungsi seksual dan dapat membantu berhenti merokok adalah:", "options": ["Fluoxetine", "Amitriptyline", "Bupropion", "Paroxetine", "Sertraline"], "answer": 2, "rationale": "Bupropion memiliki risiko disfungsi seksual lebih rendah dan dipakai untuk berhenti merokok.", "image": null}, {"topic": "Farmakologi", "stem": "Pasien dengan mania akut dapat ditatalaksana dengan mood stabilizer berikut:", "options": ["Valproate", "Fluoxetine", "Buspirone", "Donepezil", "Propranolol"], "answer": 0, "rationale": "Valproate merupakan salah satu pilihan mood stabilizer untuk mania akut.", "image": null}, {"topic": "Farmakologi", "stem": "Pasien menggunakan risperidone kemudian merasa sangat gelisah dan tidak bisa diam, terus menggerakkan tungkai. Kondisi ini disebut:", "options": ["Parkinsonisme", "Distonia akut", "Akathisia", "Sindrom neuroleptik malignan", "Tardive dyskinesia"], "answer": 2, "rationale": "Akathisia adalah rasa gelisah subjektif dengan kebutuhan terus-menerus bergerak.", "image": null}, {"topic": "Farmakologi", "stem": "Demam tinggi, rigiditas, perubahan kesadaran, dan instabilitas otonom dua hari setelah haloperidol paling sesuai dengan:", "options": ["Akathisia", "Distonia akut", "Sindrom neuroleptik malignan", "Parkinsonisme", "Serotonin syndrome"], "answer": 2, "rationale": "Sindrom neuroleptik malignan adalah reaksi mengancam jiwa akibat blokade dopamin.", "image": null}, {"topic": "Farmakologi", "stem": "Risperidone termasuk golongan:", "options": ["Antiansietas", "Antipsikotik tipikal", "Antipsikotik atipikal", "Mood stabilizer", "Antidepresan trisiklik"], "answer": 2, "rationale": "Risperidone adalah antipsikotik generasi kedua/atipikal.", "image": null}, {"topic": "Farmakologi", "stem": "Methadone merupakan:", "options": ["Antagonis opioid", "Katekolamin", "NSAID", "Opioid endogen", "Opioid sintetik"], "answer": 4, "rationale": "Metadon adalah agonis opioid sintetik kerja panjang.", "image": null}, {"topic": "Farmakologi", "stem": "GABA terutama merupakan neurotransmiter:", "options": ["Eksitatorik", "Inhibitorik", "Kolenergik", "Adrenergik", "Neurohormonal"], "answer": 1, "rationale": "GABA adalah neurotransmiter inhibitorik utama di SSP.", "image": null}, {"topic": "Farmakologi", "stem": "Obat lini pertama yang sering digunakan untuk ADHD adalah:", "options": ["Diazepam dan amfetamin", "Metilfenidat dan dextroamfetamin", "Kloral hidrat dan lorazepam", "Fenobarbital dan amfetamin", "Carbamazepine dan amfetamin"], "answer": 1, "rationale": "Psikostimulan seperti metilfenidat merupakan terapi utama ADHD.", "image": null}, {"topic": "Neuroinfeksi", "stem": "Pasien HIV dengan CD4 <100, nyeri kepala, muntah proyektil, gangguan penglihatan, dan tinta India positif pada CSS paling mungkin mengalami:", "options": ["Toksoplasmosis serebri", "Meningitis TB", "Malaria serebral", "Rabies", "Meningitis kriptokokus"], "answer": 4, "rationale": "Tinta India positif menunjukkan Cryptococcus neoformans pada CSS.", "image": null}, {"topic": "Neuroinfeksi", "stem": "Pasien HIV dengan kejang, hemiparesis, dan lesi multipel ring-enhancing pada CT kepala paling tepat diterapi dengan:", "options": ["Fluconazole tunggal", "Rifampisin-isoniazid", "Pirimetamin dan klindamisin", "Metronidazole-penisilin G", "Amfoterisin B-fluconazole"], "answer": 2, "rationale": "Lesi multipel ring-enhancing pada HIV sering adalah toksoplasmosis serebri; terapi termasuk pirimetamin dengan klindamisin atau sulfadiazin.", "image": null}, {"topic": "Neuroinfeksi", "stem": "Anak 8 tahun mengalami dua kali kejang, apatis, dan kaku kuduk. Diagnosis yang paling perlu dipikirkan adalah:", "options": ["Kejang demam sederhana", "Meningitis", "Absans", "Tic disorder", "Migrain"], "answer": 1, "rationale": "Kaku kuduk dan perubahan kesadaran mengarah pada infeksi meningeal, bukan kejang demam sederhana.", "image": null}, {"topic": "Neuroinfeksi", "stem": "Pemeriksaan penting untuk memastikan diagnosis meningitis setelah menilai keamanan prosedur adalah:", "options": ["EEG", "Pungsi lumbal dan analisis CSS", "EMG", "CT angiografi", "USG abdomen"], "answer": 1, "rationale": "Analisis cairan serebrospinal dari pungsi lumbal diperlukan untuk diagnosis etiologis meningitis bila tidak ada kontraindikasi.", "image": null}, {"topic": "Pediatri", "stem": "Anak 2 tahun demam dengan empat kejang umum singkat dalam 24 jam, kembali sadar setelah kejang, dan tanpa kaku kuduk. Diagnosisnya adalah:", "options": ["Kejang demam sederhana", "Kejang demam kompleks", "Status epileptikus", "Meningitis", "Epilepsi"], "answer": 1, "rationale": "Kejang berulang dalam 24 jam adalah kriteria kejang demam kompleks.", "image": null}, {"topic": "Pediatri", "stem": "Anak 4 tahun demam 1 hari mengalami satu kejang umum selama 5 menit dan sadar penuh setelahnya. Diagnosis paling sesuai adalah:", "options": ["Ensefalitis", "Kejang demam sederhana", "Meningitis", "Abses otak", "Meningoensefalitis"], "answer": 1, "rationale": "Kejang umum tunggal <15 menit tanpa defisit dan tanpa kekambuhan 24 jam memenuhi kejang demam sederhana.", "image": null}, {"topic": "Pediatri", "stem": "Imunisasi yang membantu mencegah infeksi susunan saraf pusat akibat Haemophilus influenzae tipe b adalah:", "options": ["BCG", "DPT", "Hib", "Varisela", "Hepatitis B"], "answer": 2, "rationale": "Vaksin Hib mencegah penyakit invasif H. influenzae tipe b termasuk meningitis.", "image": null}, {"topic": "Neuroinfeksi", "stem": "Pada dugaan meningitis bakterialis, terapi utama empiris adalah:", "options": ["Restriksi cairan", "Manitol", "Antibiotik segera", "Antipiretik saja", "Antikonvulsan saja"], "answer": 2, "rationale": "Antibiotik empiris tidak boleh ditunda pada kecurigaan meningitis bakterialis setelah kultur sesuai kondisi memungkinkan.", "image": null}, {"topic": "Patologi", "stem": "Temuan histopatologi khas pada ensefalitis rabies adalah:", "options": ["Nekrosis koagulatif", "Badan Negri", "Kromatolisis", "Lewy body", "Inklusi intranuklear Cowdry"], "answer": 1, "rationale": "Badan Negri adalah inklusi sitoplasmik eosinofilik khas rabies.", "image": null}, {"topic": "Farmakologi", "stem": "Anestesi lokal dengan durasi kerja panjang adalah:", "options": ["Lidocaine", "Mepivacaine", "Procaine", "Bupivacaine", "Chloroprocaine"], "answer": 3, "rationale": "Bupivacaine merupakan anestetik lokal kerja panjang.", "image": null}, {"topic": "Farmakologi", "stem": "Phenytoin dan lamotrigine bekerja terutama dengan:", "options": ["Menghambat kanal natrium bertegangan", "Mengaktifkan kanal natrium", "Menghambat kanal kalsium T-type", "Membuka kanal kalium KCNQ", "Menghambat reseptor GABA-A"], "answer": 0, "rationale": "Keduanya terutama menstabilkan kanal natrium inaktif dan menekan tembakan neuron berulang.", "image": null}, {"topic": "Epilepsi", "stem": "Kegagalan pengobatan epilepsi setelah penggunaan dua regimen obat antikejang yang sesuai dan ditoleransi disebut:", "options": ["Pharmacoresistant/drug-resistant epilepsy", "Sumasi", "Tapering off", "Desensitisasi", "Inhibisi"], "answer": 0, "rationale": "Definisi epilepsi resisten obat adalah kegagalan dua percobaan ASM yang tepat dan ditoleransi.", "image": null}, {"topic": "Neuroinfeksi", "stem": "CSS keruh, sel 1000/mm3 dengan PMN dominan, glukosa rendah, dan protein tinggi paling sesuai dengan:", "options": ["Meningitis bakterialis", "Meningitis aseptik", "Meningitis viral", "Guillain-Barre", "Ensefalitis autoimun"], "answer": 0, "rationale": "Pleositosis neutrofil, hipoglikorakia, dan protein tinggi merupakan pola CSS meningitis bakterialis.", "image": null}, {"topic": "Patologi", "stem": "Lesi patologis khas penyakit Parkinson adalah:", "options": ["Badan Negri", "Plak amiloid", "Badan Aschoff", "Badan Psammoma", "Badan Heinz"], "answer": 0, "rationale": "Penyakit Parkinson ditandai kehilangan neuron substantia nigra dengan badan Lewy (alpha-synuclein).", "ima  "Antiansietas", "Antidepresan", "Mood stabilizer", "Antikolinergik"], "answer": 2, "rationale": "Antidepresan merupakan farmakoterapi utama untuk episode depresi setelah evaluasi klinis menyeluruh.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien mengalami cemas, sulit tidur, takut keluar rumah, dan palpitasi tanpa gejala psikosis. Terapi obat jangka pendek untuk meredakan kecemasan akut dapat berupa:", "options": ["Risperidone", "Haloperidol", "Maprotiline", "Benzodiazepine", "Donepezil"], "answer": 3, "rationale": "Benzodiazepin dapat dipakai jangka pendek pada kecemasan akut dengan mempertimbangkan risiko ketergantungan.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien episode manik dengan agitasi dan perilaku belanja berlebihan membutuhkan terapi farmakologis awal berupa:", "options": ["Antidepresan tunggal", "Antipsikotik ditambah mood stabilizer", "Benzodiazepin tunggal jangka panjang", "Donepezil", "Psikoterapi saja"], "answer": 1, "rationale": "Mania akut umumnya memerlukan mood stabilizer dan/atau antipsikotik; antidepresan tunggal dapat memperburuk mania.", "image": null}, {"topic": "Psikiatri", "stem": "Untuk delirium dengan agitasi berat setelah penyebab medis dievaluasi dan ditatalaksana, obat simptomatik yang lazim digunakan adalah:", "options": ["Fluoxetine", "Haloperidol dosis rendah", "Lithium", "Clozapine dosis tinggi", "Valproate tunggal"], "answer": 1, "rationale": "Haloperidol dosis rendah dapat digunakan untuk agitasi pada delirium bila nonfarmakologis tidak cukup, sambil tetap menangani penyebabnya.", "image": null}, {"topic": "Psikiatri", "stem": "Menurut teori Freud, agresi verbal/oral aggression dikaitkan dengan fiksasi pada fase:", "options": ["Oral", "Anal", "Falik", "Laten", "Genital"], "answer": 0, "rationale": "Fiksasi pada fase oral dapat dikaitkan dengan perilaku yang menggunakan mulut, termasuk agresi verbal.", "image": null}, {"topic": "Psikiatri", "stem": "Peningkatan jumlah reseptor postsinaps sebagai respons ter tonomy versus shame", "Initiative versus guilt", "Identity versus role confusion", "Integrity versus despair"], "answer": 3, "rationale": "Masa remaja berfokus pada pembentukan identitas diri.", "image": null}, {"topic": "Psikiatri", "stem": "Gejala inti gangguan obsesif-kompulsif pada pasien yang mencuci tangan berulang karena takut kontaminasi adalah:", "options": ["Waham dan halusinasi", "Obsesi dan kompulsi", "Ilusi dan derealisasi", "Mania dan hipomania", "Amnesia dan fugue"], "answer": 1, "rationale": "Pikiran kontaminasi yang intrusif adalah obsesi; mencuci berulang adalah kompulsi.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien depresi memiliki gejala psikotik berupa suara mengatakan dirinya tidak berguna; sebelumnya ada periode mood meningkat dan banyak ide. Diagnosis paling sesuai adalah:", "options": ["Episode depresi unipolar", "Gangguan bipolar dengan ciri psikotik", "Gangguan panik", "Gangguan konversi", "Gangguan skizotipal"], "answer": 1, "rationale": "Riwayat perubahan mood ke arah manik/hipomanik bersama episode depresi dengan psikotik mengarah ke gangguan bipolar.", "image": null}, {"topic": "Farmakologi", "stem": "Selain antagonisme D2, target reseptor penting antipsikotik generasi kedua adalah:", "options": ["5-HT2A", "Reseptor opioid mu", "Reseptor NMDA", "Reseptor nikotinik", "Reseptor H2"], "answer": 0, "rationale": "Antagonisme 5-HT2A bersama efek D2 merupakan ciri utama banyak antipsikotik atipikal.", "image": null}, {"topic": "Farmakologi", "stem": "Reseptor utama yang menjadi target terapi antipsikosis untuk mengendalikan gejala positif psikosis adalah:", "options": ["Dopamin D1", "Dopamin D2", "Dopamin D3", "Dopamin D4", "GABA-A"], "answer": 1, "rationale": "Blokade D2 adalah mekanisme inti sebagian besar antipsikotik.", "image": null}, {"topic": "Psikiatri", "stem": "Gangguan penyesuaian setelah pindah kerja yang gejala utamanya khawatir, gelisah, dan tegang termasuk tipe:", "options": ["Dengan afek depresif", "Dengan ansietas ik untuk gejala psikosis.", "image": null}, {"topic": "Psikiatri", "stem": "Mendengar suara berbicara jelas padahal tidak ada orang yang berbicara adalah:", "options": ["Waham", "Halusinasi auditorik", "Ilusi", "Derealisation", "Depersonalisasi"], "answer": 1, "rationale": "Persepsi suara tanpa rangsang eksternal adalah halusinasi auditorik.", "image": null}, {"topic": "Farmakologi", "stem": "Efek antitusif opioid terutama terjadi melalui:", "options": ["Penekanan pusat batuk di medula", "Stimulasi CTZ", "Pelepasan dopamin", "Pelepasan histamin", "Aktivasi refleks muntah"], "answer": 0, "rationale": "Opioid menekan pusat batuk di medula.", "image": null}, {"topic": "Psikiatri", "stem": "Pasien dengan keluhan fisik disertai aritmia ringan yang dipengaruhi stres psikologis paling sesuai dengan konsep:", "options": ["Gangguan psikosomatik", "Gangguan konversi", "Gangguan amnestik", "Skizofrenia", "Gangguan disosiatif"], "answer": 0, "rationale": "Gangguan psikosomatik menggambarkan pengaruh faktor psikologis pada kondisi fisik yang nyata.", "image": null}, {"topic": "Psikiatri", "stem": "Anak sulit memahami instruksi sederhana, membedakan kalimat tanya/perintah, dan mengenali objek familiar. Gangguan bahasa paling sesuai adalah:", "options": ["Gangguan bahasa ekspresif", "Gangguan bahasa reseptif", "Gangguan fonologis", "Gagap", "Gangguan artikulasi"], "answer": 1, "rationale": "Keterbatasan utama memahami bahasa menunjukkan gangguan bahasa reseptif.", "image": null}, {"topic": "Psikiatri", "stem": "Ledakan marah yang tidak sebanding dengan stresor dan sulit dikendalikan paling sesuai dengan:", "options": ["Gangguan kepribadian paranoid", "Gangguan kepribadian skizoid", "Gangguan kepribadian anankastik", "Gangguan kepribadian eksplosif", "Gangguan kepribadian dependen"], "answer": 3, "rationale": "Gangguan kepribadian eksplosif ditandai disontrol emosi dan ledakan agresi yang berat.", "image": null}, {"topic": "Farmakologi", "stem": "Clozapine termasuk golongan:", "options": ["Antagonis opioid", "Antipsikotik atipikal", "Opioid endogen", "Opioid sintetik", "Antipsikotik tipikal"], "answer": 1, "rationale": "Clozapine merupakan antipsikotik generasi kedua/atipikal.", "image": null}, {"topic": "Farmakologi", "stem": "Pasien dengan psikosis akut, agitasi, dan kecurigaan berat dapat diberi:", "options": ["Alprazolam saja", "Haloperidol", "Fluoxetine", "Maprotiline", "Donepezil"], "answer": 1, "rationale": "Haloperidol dapat digunakan untuk kontrol cepat gejala psikosis/agitatif sesuai evaluasi klinis.", "image": null}, {"topic": "Farmakologi", "stem": "Badan kaku, langkah seperti robot, dan mata melirik ke atas setelah haloperidol dengan laboratorium normal merupakan:", "options": ["Kejang epilepsi", "Gejala ekstrapiramidal", "Delirium", "Sindrom neuroleptik malignan", "Gangguan cemas"], "answer": 1, "rationale": "Rigiditas dan krisis okulogirik merupakan manifestasi ekstrapiramidal akibat blokade D2.", "image": null}, {"topic": "Psikiatri", "stem": "Anak 10 tahun kesulitan pelajaran, masih mengikuti instruksi sederhana, dan membutuhkan bantuan mandi serta berpakaian. Derajat disabilitas intelektual paling sesuai adalah:", "options": ["Ringan", "Sedang", "Berat", "Sangat berat", "Tidak terklasifikasi"], "answer": 1, "rationale": "Kebutuhan bantuan bermakna dalam aktivitas perawatan diri mendukung derajat sedang.", "image": null}, {"topic": "Psikiatri", "stem": "Dalam observasi visum et repertum psikiatrikum, prinsip pemberian obat adalah:", "options": ["Selalu diberi obat ringan", "Tanpa obat rutin kecuali ada indikasi keselamatan klinis", "Selalu obat sesuai diagnosis", "Selalu benzodiazepin", "Selalu antipsikotik"], "answer": 1, "rationale": "Observasi diupayakan tanpa terapi yang mengaburkan penilaian, kecuali ada kebutuhan klinis/keamanan yang harus ditangani.", "image": null}, {"topic": "Psikiatri", "stem": "Nyeri perut tanpa temuan organik bermakna, dengan keluhan fisik menonjol, paling sesuai dengan:", "options": ["Gangguan ps Radiologi", "stem": "Perhatikan radiograf tengkorak berikut. Lesi litik multipel 'punched-out' paling khas untuk:", "options": ["Multiple myeloma", "Meningioma", "Osteopetrosis", "Paget disease", "Metastasis tiroid"], "answer": 0, "rationale": "Multiple myeloma dapat menimbulkan banyak lesi litik punched-out pada tulang tengkorak.", "image": "assets/yang_baroee__image4.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT tulang kepala berikut. Temuan yang tampak pada gambar paling sesuai dengan:", "options": ["Fraktur tulang tengkorak", "Hidrosefalus", "Abses serebri", "Infark serebri", "Perdarahan subaraknoid"], "answer": 0, "rationale": "Garis diskontinuitas tulang pada CT bone window menunjukkan fraktur tulang tengkorak.", "image": "assets/yang_baroee__image5.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan seri CT berikut. Koleksi ekstraaksial berbentuk bulan sabit yang dapat melewati sutura paling sesuai dengan:", "options": ["Hematoma epidural", "Hematoma subdural", "Perdarahan subaraknoid", "Perdarahan intraventrikular", "Tumor otak"], "answer": 1, "rationale": "Hematoma subdural biasanya berbentuk crescent dan dapat menyebar melewati garis sutura.", "image": "assets/yang_baroee__image6.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT berikut. Fokus hiperdens di dalam parenkim otak paling sesuai dengan:", "options": ["Perdarahan intraparenkimal", "Hidrosefalus", "Meningioma", "Abses serebri", "Infark kronik"], "answer": 0, "rationale": "Perdarahan akut tampak hiperdens pada CT nonkontras dan berada di dalam parenkim pada perdarahan intraserebral.", "image": "assets/yang_baroee__image7.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT berikut. Area hipodens di parenkim otak sesuai dengan:", "options": ["Infark serebri iskemik", "Hematoma epidural", "Perdarahan akut", "Kista arakhnoid", "Abses dengan dinding tebal"], "answer": 0, "rationale": "Infark iskemik pada CT umumnya tampak hipodens, terutama setelah perubahan iskemik berkembang.", "image": "assets/yang_baroee__image8.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT berikut. Lesi iskemik yang tampak pada batang otak paling sesuai dengan:", "options": ["Infark pons", "Infark lobus frontal", "Hematoma subdural", "Hidrosefalus", "Meningioma"], "answer": 0, "rationale": "Gambaran menunjukkan infark pada pons, bagian dari batang otak.", "image": "assets/yang_baroee__image9.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT berikut. Ciri radiologis utama perdarahan serebri akut pada CT nonkontras adalah:", "options": ["Lesi hiperdens", "Lesi hipodens", "Tidak ada perubahan densitas", "Kalsifikasi homogen", "Pelebaran sulkus"], "answer": 0, "rationale": "Darah akut tampak hiperdens pada CT kepala nonkontras.", "image": "assets/yang_baroee__image10.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan CT dan MRI berikut. Koleksi subdural dengan tanda infeksi paling sesuai dengan:", "options": ["Empiema subdural", "Hematoma epidural", "Meningioma", "Infark serebri", "Hidrosefalus"], "answer": 0, "rationale": "Empiema subdural adalah koleksi purulen di ruang subdural dan dapat terlihat pada CT maupun MRI.", "image": "assets/yang_baroee__image11.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan rangkaian CT/MRI berikut. Lesi dengan gambaran khas abses serebri paling mungkin menunjukkan:", "options": ["Ring enhancement dengan edema sekitar", "Koleksi lensa ekstraaksial", "Perdarahan di cisterna basal", "Pelebaran ventrikel saja", "Atrofi hipokampus"], "answer": 0, "rationale": "Abses serebri umumnya tampak sebagai lesi ring-enhancing dengan edema vasogenik di sekitarnya.", "image": "assets/yang_baroee__image12.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan gambar tumor otak berikut. Tumor glial yang lazim dapat tampak sebagai massa intraaksial adalah:", "options": ["Astrositoma", "Meningioma", "Schwannoma vestibular", "Adenoma hipofisis", "Craniopharyngioma"], "answer": 0, "rationale": "Astrositoma merupakan tumor glial intraaksial; gambar sumber memuat contoh tumor glial/pilocytic astrocytoma.", "image": "assets/yang_baroee__image13.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan MRI berikut. Lesi multipel dengan gambaran radang parenkim otak dalam konteks infeksi paling sesuai dengan:", "options": ["Ensefalitis", "Hematoma subdural", "Hidrosefalus obstruktif", "Meningioma", "Fraktur tengkorak"], "answer": 0, "rationale": "Gambaran sumber diberi label encephalitis dan menunjukkan perubahan inflamasi parenkim.", "image": "assets/yang_baroee__image14.jpeg"}, {"topic": "Radiologi", "stem": "Perhatikan MRI malformasi fossa posterior berikut. Pelebaran kistik fossa posterior dengan hipoplasia vermis paling sesuai dengan:", "options": ["Dandy-Walker malformation", "Arnold-Chiari I", "Meningioma", "Abses serebri", "Hidrosefalus normal pressure"], "answer": 0, "rationale": "Dandy-Walker ditandai malformasi vermis dan pelebaran kistik fossa posterior; gambar juga memperlihatkan pembanding Chiari II.", "image": "assets/yang_baroee__image15.jpeg"}];
let bank = structuredClone(originalBank), current = 0, answers = Array(bank.length).fill(null);
const $ = s => document.querySelector(s), letters = ['A','B','C','D','E'];
function render() {
  const item = bank[current], answer = answers[current], complete = answer !== null;
  $('#counter').textContent = `Soal ${current + 1} dari ${bank.length}`;
  $('#answered').textContent = `${answers.filter(a => a !== null).length} sudah dijawab`;
  $('#bar').style.width = `${(answers.filter(a => a !== null).length / bank.length) * 100}%`;
  $('#question').innerHTML = `<div class="topic">${item.topic}</div><div class="stem">${item.stem}</div>${item.image ? `<img class="question-image" src="${item.image}" alt="Gambar penunjang soal ${current + 1}">` : ''}<div class="options">${item.options.map((op, i) => `<button class="option ${complete && i === item.answer ? 'correct' : ''} ${complete && answer === i && i !== item.answer ? 'wrong' : ''}" data-choice="${i}" ${complete ? 'disabled' : ''}><span class="letter">${letters[i]}</span><span>${op}</span></button>`).join('')}</div>`;
  const fb = $('#feedback'); fb.className = 'feedback'; fb.innerHTML = '';
  if (complete) { const ok = answer === item.answer; fb.className = `feedback show ${ok ? 'good' : 'bad'}`; fb.innerHTML = `<strong>${ok ? 'Jawaban benar.' : 'Jawaban belum tepat.'}</strong>${ok ? '' : `Jawaban benar: ${letters[item.answer]}. ${item.options[item.answer]}<br>`}<span>${item.rationale}</span>`; }
  document.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.choice))));
  $('#prev').disabled = current === 0; $('#next').textContent = current === bank.length - 1 ? 'Lihat hasil' : 'Berikutnya →';
}
function choose(i) { answers[current] = i; render(); }
function next() { if (current < bank.length - 1) { current++; render(); } else showResults(); }
function showResults() { const done = answers.filter(a => a !== null).length; const correct = answers.reduce((n,a,i) => n + (a === bank[i].answer), 0); $('#quiz').style.display='none'; $('#results').classList.add('show'); $('#score').textContent = `${correct} / ${bank.length}`; $('#resultText').textContent = `Benar ${correct} soal dari ${bank.length}. Anda telah menjawab ${done} soal.`; }
function reset(shuffle=false) { bank = structuredClone(originalBank); if(shuffle) bank.sort(() => Math.random() - .5); answers = Array(bank.length).fill(null); current=0; $('#results').classList.remove('show'); $('#quiz').style.display='block'; render(); }
$('#prev').onclick = () => { if(current) {current--; render();} }; $('#next').onclick = next; $('#reset').onclick = () => reset(false); $('#tryAgain').onclick = () => reset(false); $('#review').onclick = () => { $('#results').classList.remove('show'); $('#quiz').style.display='block'; current=0; render(); }; $('#shuffle').onclick = () => reset(true);
render();
</script>
